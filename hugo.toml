baseURL = 'https://eelviny.me/'
languageCode = 'en-us'
title = 'Eelviny'

[params]
themeColor = "theme-base"
description = "My name's Elvin Luff, but I go by the username Eelviny. I put my money where my mouth is on my love of smarthome technologies, and I've got a passion for all things running and IoT. Welcome to my space."

[Menus]
main = []

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[caches]
    [caches.images]
    dir = ':cacheDir/images'
