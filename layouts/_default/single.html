{{ define "main" -}}
<div class="max-w-7xl mx-auto pt-8 p-4">
  <h1 class="font-serif text-3xl/12 md:text-4xl/12 font-bold">{{ .Title }}</h1>
  <time datetime={{ .Date.Format "2006-01-02T15:04:05Z0700" }} class="post-date text-gray-500">{{ .Date.Format "Mon, Jan 2, 2006" }}</time>
  <div class="text-lg mt-8">
      {{ .Content }}
  </div>
</div>

{{ if .Site.Config.Services.Disqus.Shortname -}}
<h2>Comments</h2>
{{ template "_internal/disqus.html" . }}
{{- end }}
{{- end }}
