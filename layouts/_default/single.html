{{ define "main" -}}
<div class="max-w-4xl mx-auto pt-8 p-4">
  <article class="prose prose-h1:font-serif prose-h2:font-serif max-w-none">
    <h1 class="font-serif text-3xl/12 md:text-4xl/12 font-bold">{{ .Title }}</h1>
    <time datetime={{ .Date.Format "2006-01-02T15:04:05Z0700" }} class="post-date text-gray-500">{{ .Date.Format "2 January 2006" }}</time>
    {{if isset .Params "featured_image" }}<img src="{{ index .Params "featured_image" }}">{{ end }}
    {{ .Content }}
</article>
</div>

{{ if .Site.Config.Services.Disqus.Shortname -}}
<h2>Comments</h2>
{{ template "_internal/disqus.html" . }}
{{- end }}
{{- end }}
